name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format cyclonedx > release/sbom.json
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*'
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tgz
            release/SHA256SUMS
            release/sbom.json
          generate_release_notes: true
