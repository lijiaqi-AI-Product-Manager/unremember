name: Feature request
description: Suggest a store, adapter, or safety improvement.
title: '[feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should unremember be able to forget or prove that it cannot today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Claude Code
        - dsh
        - new platform
        - CLI / UX
        - docs / packaging
        - verification
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request can be tested with synthetic data and does not require uploading a real session.
          required: true
